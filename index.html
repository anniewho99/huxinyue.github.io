<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Xinyue (Annie) Hu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    html, body { cursor: crosshair; }
    a, button {
      cursor: url("cursor-diamond-32.png") 16 16, pointer;
    }

    :root { --gap: 24px; --text: #1c1a17; --text-dim: #4b4740; --maxw: 900px; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; min-height: 100svh; color: var(--text);
      font-family: "Charis SIL", Palatino, Georgia, serif;
      line-height: 1.5; display: grid; place-items: stretch;
      background: #f4f2ec center / cover no-repeat url("background.jpg");
      background-attachment: fixed;
    }

    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0;
      background: rgba(248, 246, 240, 0.82);
      pointer-events: none;
    }

    .hero {
      position: relative; min-height: 100svh;
      display: grid; grid-template-rows: auto 1fr auto;
      isolation: isolate; z-index: 1;
    }

    nav {
      z-index: 1; display: flex; justify-content: center;
      gap: clamp(20px, 5vw, 56px);
      padding: clamp(18px, 4vh, 56px) 24px;
      flex-wrap: wrap;
    }
    nav a {
      font-weight: 500; font-size: clamp(16px, 3vw, 20px);
      letter-spacing: .02em; color: var(--text);
      text-decoration: none; text-underline-offset: 4px;
    }
    nav a:hover, nav a:focus { text-decoration: underline; }

    .spacer { z-index: 1; }

    .name {
      z-index: 1; padding: var(--gap); text-align: center;
      font-size: clamp(22px, 2.6vw, 34px); font-weight: 400;
      color: var(--text-dim); letter-spacing: .06em;
      user-select: none; pointer-events: none;
    }

    .tagline {
      z-index: 1; text-align: center; max-width: 46ch;
      margin: 0 auto clamp(8px, 2vh, 16px); padding: 0 24px;
      color: var(--text-dim); font-size: 17px;
    }

    .sc {
      text-transform: lowercase;
      font-variant-caps: small-caps;
      font-feature-settings: "smcp" 1, "c2sc" 1;
      letter-spacing: .04em;
    }
    .sc::first-letter {
      text-transform: uppercase;
      font-variant-caps: normal;
    }

    @media (max-width: 768px), (hover: none) and (pointer: coarse) {
      body { background-attachment: scroll; }
      a, button { cursor: pointer; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <nav aria-label="Primary">
      <a class="sc" href="/about.html">About</a>
      <a class="sc" href="/research.html">Research</a>
      <a class="sc" href="/experience.html">Experience</a>
      <a class="sc" href="/CV.pdf">CV</a>
      <a class="sc" href="/contact.html">Contact</a>
    </nav>

    <div class="spacer" aria-hidden="true"></div>

    <div class="name sc">Xinyue (Annie) Hu</div>
    <p class="tagline">[One line: what you study and what you're looking for next — e.g. human-AI decision-making, now moving into applied data science / human factors roles.]</p>
  </main>
</body>
</html>
