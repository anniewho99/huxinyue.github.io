<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact · Xinyue Hu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    html, body { cursor: crosshair; }
    a, button { cursor: url("cursor-diamond-32.png") 16 16, pointer; }

    :root { --gap: 24px; --text: #1c1a17; --maxw: 900px; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; min-height: 100svh; color: var(--text);
      font-family: "Charis SIL", Palatino, Georgia, serif;
      line-height: 1.5; display: grid; place-items: stretch;
      background: #f4f2ec center / cover no-repeat url("background.jpg");
      background-attachment: fixed;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0;
      background: rgba(248, 246, 240, 0.85);
      pointer-events: none;
    }

    .hero {
      position: relative; min-height: 100svh;
      display: grid; grid-template-rows: auto 1fr auto;
      isolation: isolate; z-index: 1;
    }

    .topnav { z-index: 1; display: flex; justify-content: center; padding: clamp(18px,4vh,56px) var(--gap); }
    .topnav a {
      color: var(--text); text-decoration: none; font-weight: 700;
      font-size: clamp(18px,2.2vw,26px); text-underline-offset: 4px;
    }
    .topnav a:hover, .topnav a:focus { text-decoration: underline; }

    .contact {
      z-index: 1; display: grid; place-items: center; align-content: start;
      gap: clamp(16px,4vh,40px); padding: 0 var(--gap) var(--gap);
    }
    .copy {
      width: 100%; max-width: var(--maxw); text-align: center;
      margin-top: clamp(24px,10vh,120px);
    }
    .copy p { margin: 0 0 14px; }

    .email { font-weight: 700; font-size: clamp(14px,2.2vw,20px); color: var(--text); text-decoration: none; }
    .email:hover, .email:focus { text-decoration: underline; }

    .links { display: flex; justify-content: center; gap: 20px; margin-top: 8px; font-size: 16px; }
    .links a { color: var(--text); }

    .page-label {
      z-index: 1; padding: var(--gap); text-align: center;
      font-size: clamp(22px,3vw,34px); font-weight: 700; color: var(--text);
      letter-spacing: .04em; user-select: none; pointer-events: none;
    }

    .sc {
      text-transform: lowercase; font-variant-caps: small-caps;
      font-feature-settings: "smcp" 1, "c2sc" 1; letter-spacing: .04em;
    }
    .sc::first-letter { text-transform: uppercase; font-variant-caps: normal; }
  </style>
</head>
<body>
  <main class="hero">
    <nav class="topnav" aria-label="Primary">
      <a class="sc" href="/">Home</a>
    </nav>

    <section class="contact">
      <div class="copy">
        <p>You can reach me via email at</p>
        <p><a class="email" href="mailto:xhu26@uci.edu">xhu26@uci.edu</a></p>
        <div class="links">
          <a href="https://www.linkedin.com/in/xinyuehu1999/">LinkedIn</a>
          <a href="https://github.com/anniewho99">GitHub</a>
        </div>
      </div>
    </section>

    <div class="page-label sc">Contact</div>
  </main>
</body>
</html>
